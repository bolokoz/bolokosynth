[env:esp32-s2-ttgo]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI
    tanakamasayuki/EspUsbHost

build_flags =
    ; Disable USB CDC on boot to use native USB for Host
    -D ARDUINO_USB_CDC_ON_BOOT=0

    ; TFT_eSPI Configuration for TTGO ESP32-S2 ST7789
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1

    ; Tentative Pin Configuration (Verify with board schematics)
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=34
    -D TFT_DC=37
    -D TFT_RST=38
    -D TFT_BL=33
    -D TFT_BACKLIGHT_ON=HIGH

    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
