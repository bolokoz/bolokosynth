; Historical S3 synth/startup/GPIO-screening builds; select the environment explicitly.
; Each source filter selects one setup/loop. Native USB mode differs between host and diagnostics.
; The cold-start reset workaround is documented; build settings alone do not fix the hardware.

[platformio]
default_envs = esp32s3

; Use the reset method verified on this board after flashing.
[env]
board_upload.after_reset = watchdog-reset

[env:esp32s3]
build_src_filter = +<main.cpp>
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    tanakamasayuki/EspUsbHost
build_flags =
    ; The Mac uses the board's USB-to-UART port while the native USB port
    ; is reserved for the USB MIDI controller/host connection.
    -DARDUINO_USB_CDC_ON_BOOT=0

; Standalone startup test: native USB serial, RGB heartbeat, no peripherals.
[env:boot-diagnostic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<boot-diagnostic.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0

; Input-only weak-pull screening of ordinary adjacent header GPIOs.
[env:gpio-scan]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<gpio-short-scan.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0
