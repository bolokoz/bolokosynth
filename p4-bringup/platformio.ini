; Active P4 v1 and separate USB diagnostic builds. Source filters prevent duplicate setup/loop.
; FUSB hardware USB Serial/JTAG stays available while HUSB hosts MIDI.
; Board definition targets pre-rev300 silicon; 16MB upload size reflects the tested board.

[platformio]
default_envs = esp32-p4

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino

; Keep FUSB hardware Serial/JTAG logs separate from the HUSB host.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

board_upload.flash_size = 16MB

lib_deps =
    https://github.com/tanakamasayuki/EspUsbHost.git#main
    adafruit/Adafruit ST7735 and ST7789 Library

monitor_speed = 115200

[env:esp32-p4]
build_src_filter = +<main.cpp> +<SynthUi.cpp>

[env:midi-diagnostic]
build_src_filter = +<midi-diagnostic.cpp>
